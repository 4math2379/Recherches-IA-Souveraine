  <text x="500" y="470" text-anchor="middle" font-size="14" font-weight="bold">🧠 vLLM multi-nœuds — Mistral open-weights</text>
  <text x="500" y="490" text-anchor="middle" font-size="10" fill="#888">tensor parallel 8 × pipeline parallel 8 · NCCL over InfiniBand RDMA · poids locaux uniquement</text>
  

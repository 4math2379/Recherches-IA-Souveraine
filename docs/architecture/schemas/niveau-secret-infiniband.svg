  <line x1="480" y1="315" x2="520" y2="315" stroke="#e65100" stroke-width="2" stroke-dasharray="5,3"/>
  
  <line x1="500" y1="340" x2="500" y2="365" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>
  

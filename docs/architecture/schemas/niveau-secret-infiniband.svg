  <!-- Bastion + Portail -->
  <rect x="40" y="205" width="440" height="55" rx="8" fill="white" stroke="#e65100" stroke-width="2"/>
  <text x="60" y="227" font-size="13" font-weight="bold">🛡️ Bastion interne</text>
  <text x="60" y="247" font-size="11" fill="#666">MFA + carte à puce + biométrie</text>
  
  <rect x="520" y="205" width="440" height="55" rx="8" fill="white" stroke="#e65100" stroke-width="2"/>
  <text x="540" y="227" font-size="13" font-weight="bold">🖥️ Portail Vibe interne</text>
  <text x="540" y="247" font-size="11" fill="#666">SSO local · interface web air-gapped</text>
  
  <line x1="500" y1="260" x2="500" y2="285" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- LiteLLM Gateway HA -->
  <rect x="200" y="290" width="280" height="50" rx="8" fill="white" stroke="#e65100" stroke-width="2.5" filter="url(#shadow2)"/>

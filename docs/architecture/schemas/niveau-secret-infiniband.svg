<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgSecret" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/><stop offset="100%" stop-color="#ffe0e0"/>
    </linearGradient>
    <linearGradient id="hdrSecret" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b71c1c"/><stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37474f"/><stop offset="100%" stop-color="#455a64"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#546e7a"/><stop offset="100%" stop-color="#607d8b"/>
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76b900"/><stop offset="100%" stop-color="#5a9400"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
    </marker>
  </defs>
  
  <!-- Fond air-gapped -->
  <rect x="0" y="0" width="1000" height="750" fill="url(#bgSecret)"/>
  <rect x="20" y="70" width="960" height="660" rx="15" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="500" y="95" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">🔒 RÉSEAU INTERNE CLASSIFIÉ — AIR-GAPPED</text>
  
  <!-- Titre -->
  <rect x="0" y="0" width="1000" height="55" fill="url(#hdrSecret)"/>
  <text x="500" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="bold">🔒 Niveau Confidentiel Défense — On-Premise InfiniBand</text>
  
  <!-- Zone utilisateurs -->
  <rect x="40" y="120" width="920" height="55" rx="8" fill="white" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="142" font-size="13" font-weight="bold" fill="#c62828">👥 Utilisateurs habilités</text>
  <text x="60" y="162" font-size="11" fill="#666">Analyste · RSSI · DSI — postes sécurisés, MFA, carte à puce</text>

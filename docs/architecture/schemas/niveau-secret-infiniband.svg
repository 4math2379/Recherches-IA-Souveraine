  <text x="340" y="390" text-anchor="middle" font-size="13" font-weight="bold">⚙️ slurmctld (ctrl1 + ctrl2 HA)</text>
  <text x="340" y="408" text-anchor="middle" font-size="10" fill="#888">ordonnancement · topology/tree · prolog-ib.sh</text>
  
  <rect x="520" y="370" width="280" height="50" rx="8" fill="white" stroke="#1565c0" stroke-width="2"/>
  <text x="660" y="390" text-anchor="middle" font-size="13" font-weight="bold">💾 slurmdbd + MariaDB</text>
  <text x="660" y="408" text-anchor="middle" font-size="10" fill="#888">comptabilité GPU · quotas par client/projet</text>
  
  <line x1="480" y1="395" x2="520" y2="395" stroke="#1565c0" stroke-width="2"/>
  
  <line x1="500" y1="420" x2="500" y2="445" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- vLLM -->

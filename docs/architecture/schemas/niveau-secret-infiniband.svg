    <text x="80" y="684" text-anchor="middle" fill="white" font-size="8">8× H100</text>
    
    <rect x="130" y="650" width="80" height="45" rx="6" fill="url(#gpuGrad)"/>
    <text x="170" y="668" text-anchor="middle" fill="white" font-size="10" font-weight="bold">gpu2</text>
    <text x="170" y="684" text-anchor="middle" fill="white" font-size="8">8× H100</text>
    
    <rect x="320" y="650" width="80" height="45" rx="6" fill="url(#gpuGrad)"/>
    <text x="360" y="668" text-anchor="middle" fill="white" font-size="10" font-weight="bold">gpu3</text>
    <text x="360" y="684" text-anchor="middle" fill="white" font-size="8">8× H100</text>
    
    <rect x="410" y="650" width="80" height="45" rx="6" fill="url(#gpuGrad)"/>
    <text x="450" y="668" text-anchor="middle" fill="white" font-size="10" font-weight="bold">gpu4</text>
    <text x="450" y="684" text-anchor="middle" fill="white" font-size="8">8× H100</text>
    
    <rect x="610" y="650" width="80" height="45" rx="6" fill="url(#gpuGrad)"/>
    <text x="650" y="668" text-anchor="middle" fill="white" font-size="10" font-weight="bold">gpu5</text>
    <text x="650" y="684" text-anchor="middle" fill="white" font-size="8">8× H100</text>
    
    <rect x="700" y="650" width="80" height="45" rx="6" fill="url(#gpuGrad)"/>
    <text x="740" y="668" text-anchor="middle" fill="white" font-size="10" font-weight="bold">gpu6</text>
    <text x="740" y="684" text-anchor="middle" fill="white" font-size="8">8× H100</text>
    
    <rect x="820" y="650" width="80" height="45" rx="6" fill="url(#gpuGrad)"/>
    <text x="860" y="668" text-anchor="middle" fill="white" font-size="10" font-weight="bold">...</text>
    <text x="860" y="684" text-anchor="middle" fill="white" font-size="8">jusqu'à 64</text>
  </g>
  
  <!-- Lignes leaf-gpu -->
  <line x1="180" y1="635" x2="80" y2="650" stroke="#76b900" stroke-width="1"/>
  <line x1="220" y1="635" x2="170" y2="650" stroke="#76b900" stroke-width="1"/>
  <line x1="460" y1="635" x2="360" y2="650" stroke="#76b900" stroke-width="1"/>
  <line x1="500" y1="635" x2="450" y2="650" stroke="#76b900" stroke-width="1"/>
  <line x1="740" y1="635" x2="650" y2="650" stroke="#76b900" stroke-width="1"/>
  <line x1="780" y1="635" x2="740" y2="650" stroke="#76b900" stroke-width="1"/>
  <line x1="800" y1="635" x2="860" y2="650" stroke="#76b900" stroke-width="1"/>
  
  <!-- Badge final -->
  <text x="500" y="730" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">🔒 AIR-GAPPED · OpenSM subnet manager · topology.conf généré par ib2slurm.py · AUCUNE route externe</text>

  <text x="340" y="328" text-anchor="middle" font-size="10" fill="#888">routing · quotas · cache · audit logs locaux</text>
  
  <rect x="520" y="290" width="280" height="50" rx="8" fill="white" stroke="#e65100" stroke-width="2.5" filter="url(#shadow2)"/>

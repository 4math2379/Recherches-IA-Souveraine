name: sovereign-ai / mirror images

# Copies the public images used by the stack into the Scaleway Container Registry
# (fr-par), so Instances never pull from Docker Hub or GHCR at boot.
# Run it after a first apply with use_scaleway_registry = true created the namespace.
on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Registry namespace (Terraform output registry_endpoint, last segment)"
        default: "souverain-mirror"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          # Platform (modules/platform/variables.tf, settings.images)
          - ghcr.io/berriai/litellm:main-stable
          - docker.io/library/caddy:2
          - docker.io/vllm/vllm-openai:latest
          # Products (products/*/variables.tf)
          - ghcr.io/open-webui/open-webui:main
          - docker.io/langflowai/langflow:latest
          - docker.io/scaleway/cli:2.63.0
          - docker.io/apache/superset:5.0.0
          - docker.io/library/python:3.12-slim
    steps:
      - name: Copy with skopeo
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          IMAGE: ${{ matrix.image }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          target="rg.fr-par.scw.cloud/${NAMESPACE}/${IMAGE##*/}"
          skopeo copy --all \
            --dest-creds "nologin:${SCW_SECRET_KEY}" \
            "docker://${IMAGE}" "docker://${target}"
          echo "Mirrored ${IMAGE} -> ${target}" >> "$GITHUB_STEP_SUMMARY"

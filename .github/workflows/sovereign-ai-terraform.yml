name: sovereign-ai / terraform

# plan every product on pull requests touching the stack; apply or destroy one
# product on manual dispatch, gated by the "scaleway-prod" environment
# (add required reviewers there). Each product has its own state.
on:
  pull_request:
    paths: ["scaleway/modules/**", "scaleway/products/**", ".github/workflows/sovereign-ai-terraform.yml"]
  workflow_dispatch:
    inputs:
      product:
        description: "Product to deploy"
        type: choice
        options: [gateway, rag, agents, analytics]
        default: gateway
      action:
        description: "plan, apply or destroy"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
  SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
  # The S3 backend (Scaleway Object Storage) reads AWS-style variables.
  AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
  TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}
  # analytics only: CA of the Data Warehouse private endpoint (see products/analytics/README.md)
  TF_VAR_clickhouse_ca_cert: ${{ secrets.CLICKHOUSE_CA_CERT }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"
      - run: terraform fmt -check -recursive -diff scaleway

  plan:
    if: github.event_name == 'pull_request' || inputs.action == 'plan'
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: ${{ github.event_name == 'pull_request' && fromJSON('["gateway","rag","agents","analytics"]') || fromJSON(format('["{0}"]', inputs.product)) }}
    concurrency:
      group: sovereign-ai-${{ matrix.product }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: scaleway/products/${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"
      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=scaleway/${{ matrix.product }}.tfstate"
      - name: Validate
        run: terraform validate
      - name: Plan
        run: |
          set -o pipefail
          terraform plan -var-file=env/prod.tfvars -no-color | tee plan.txt
          { echo "### Terraform plan: ${{ matrix.product }}"; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'plan'
    needs: fmt
    runs-on: ubuntu-latest
    environment: scaleway-prod
    concurrency:
      group: sovereign-ai-${{ inputs.product }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: scaleway/products/${{ inputs.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"
      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=scaleway/${{ inputs.product }}.tfstate"
      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -var-file=env/prod.tfvars
      - name: Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var-file=env/prod.tfvars
